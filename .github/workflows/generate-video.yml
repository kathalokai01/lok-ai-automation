name: Generate Lok AI Video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # VALIDATE API SECRETS
      # ============================================================
      - name: Validate API secrets
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          API SECRET VALIDATION"
          echo "=============================================="

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "ERROR: GEMINI_API_KEY is not configured."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

          echo "Gemini API key : OK"
          echo "Cloudflare ID  : OK"
          echo "Cloudflare key : OK"

      # ============================================================
      # READ PROJECT CONFIGURATION
      # ============================================================
      - name: Read project configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          PROJECT CONFIGURATION"
          echo "=============================================="

          TOPIC=$(sed -n \
            's/^[[:space:]]*TOPIC[[:space:]]*=[[:space:]]*"\(.*\)".*$/\1/p' \
            Input/topic.txt | head -n 1)

          PARTS=$(sed -n \
            's/^[[:space:]]*PARTS[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            Input/topic.txt | head -n 1)

          SCENES=$(sed -n \
            's/^[[:space:]]*SCENES[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            Input/topic.txt | head -n 1)

          if [ -z "$PARTS" ]; then
            echo "ERROR: PARTS could not be read."
            exit 1
          fi

          if [ -z "$SCENES" ]; then
            echo "ERROR: SCENES could not be read."
            exit 1
          fi

          if ! [[ "$PARTS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid PARTS: $PARTS"
            exit 1
          fi

          if ! [[ "$SCENES" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid SCENES: $SCENES"
            exit 1
          fi

          if [ "$PARTS" -lt 1 ]; then
            echo "ERROR: PARTS must be >= 1"
            exit 1
          fi

          if [ "$SCENES" -lt 1 ]; then
            echo "ERROR: SCENES must be >= 1"
            exit 1
          fi

          TOTAL=$((PARTS * SCENES))

          echo "TOPIC              : $TOPIC"
          echo "PARTS              : $PARTS"
          echo "SCENES PER PART    : $SCENES"
          echo "TOTAL SCENES       : $TOTAL"

          echo "TOPIC=$TOPIC" >> "$GITHUB_ENV"
          echo "PARTS=$PARTS" >> "$GITHUB_ENV"
          echo "SCENES=$SCENES" >> "$GITHUB_ENV"
          echo "EXPECTED_TOTAL=$TOTAL" >> "$GITHUB_ENV"

          echo "=============================================="

      # ============================================================
      # PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare output directories
        shell: bash
        run: |
          set -e

          mkdir -p \
            output/config \
            output/story \
            output/scenes \
            output/narration \
            output/narration/audio \
            output/audio \
            output/visuals \
            output/thumbnails \
            output/publish \
            output/rendered \
            output/checkpoints \
            output/parts \
            output/final

      # ============================================================
      # RESTORE ONLY SUCCESSFUL CHECKPOINT
      # ============================================================
      - name: Restore previous successful checkpoint
        shell: bash
        run: |
          set -e

          CURRENT_RUN="${{ github.run_id }}"

          echo "Looking for previous SUCCESSFUL workflow..."

          PREVIOUS_RUN_ID=$(gh run list \
            --workflow generate-video.yml \
            --limit 30 \
            --json databaseId,status,conclusion \
            --jq ".[] |
              select(.databaseId != ${CURRENT_RUN}) |
              select(.status == \"completed\") |
              select(.conclusion == \"success\") |
              .databaseId" \
            | head -n 1)

          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo "No previous successful run found."
            exit 0
          fi

          echo "Previous successful run: $PREVIOUS_RUN_ID"

          rm -rf /tmp/lok-ai-checkpoint
          mkdir -p /tmp/lok-ai-checkpoint

          if gh run download "$PREVIOUS_RUN_ID" \
              --name lok-ai-checkpoint \
              --dir /tmp/lok-ai-checkpoint; then

            echo "Checkpoint downloaded."

            if [ -d "/tmp/lok-ai-checkpoint/output" ]; then
              cp -a \
                /tmp/lok-ai-checkpoint/output/. \
                output/

              echo "Checkpoint restored."
            else
              echo "WARNING: Checkpoint output directory missing."
            fi

          else
            echo "No checkpoint artifact available."
          fi

      # ============================================================
      # STORY PLAN
      # ============================================================
      - name: Generate story plan
        shell: bash
        run: |
          set -e
          python3 scripts/generate_story_plan.py

      # ============================================================
      # STORY
      # ============================================================
      - name: Generate story
        shell: bash
        run: |
          set -e
          python3 scripts/generate_story.py

      # ============================================================
      # GEMINI MODEL
      # ============================================================
      - name: Select Gemini model
        shell: bash
        run: |
          set -e
          python3 scripts/select_gemini_model.py

      # ============================================================
      # TEST GEMINI
      # ============================================================
      - name: Test Gemini
        shell: bash
        run: |
          set -e
          python3 scripts/test_gemini.py

      # ============================================================
      # AI STORY
      # ============================================================
      - name: Generate AI story
        shell: bash
        run: |
          set -e
          python3 scripts/generate_ai_story.py

      # ============================================================
      # CHARACTER BIBLE
      # ============================================================
      - name: Generate character bible
        shell: bash
        run: |
          set -e
          python3 scripts/generate_character_bible.py

      # ============================================================
      # SCENES
      # ============================================================
      - name: Generate scenes
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          GENERATING SCENES"
          echo "=============================================="

          python3 scripts/generate_scenes.py

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/scenes/scenes.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: scenes.json missing"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          expected = int(
              os.environ["EXPECTED_TOTAL"]
          )

          actual = len(
              data.get("scenes", [])
          )

          status = data.get("status")

          print(f"Scene status : {status}")
          print(f"Expected     : {expected}")
          print(f"Actual       : {actual}")

          if status != "completed":
              raise SystemExit(
                  "ERROR: scenes.json is not completed"
              )

          if actual != expected:
              raise SystemExit(
                  f"ERROR: Expected {expected} scenes, "
                  f"found {actual}"
              )

          print("SCENE VALIDATION: PASS")
          PY

      # ============================================================
      # NARRATION
      # ============================================================
      - name: Generate narration
        shell: bash
        run: |
          set -e
          python3 scripts/generate_narration.py

      # ============================================================
      # FFMPEG
      # ============================================================
      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================================
      # TTS
      # ============================================================
      - name: Generate Hindi TTS
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts

          python3 scripts/generate_tts.py

      # ============================================================
      # PREPARE VISUALS
      # ============================================================
      - name: Prepare visual generation
        shell: bash
        run: |
          set -e
          python3 scripts/prepare_visuals.py

      # ============================================================
      # CLOUDFLARE MODEL
      # ============================================================
      - name: Select Cloudflare visual model
        shell: bash
        run: |
          set -e
          python3 scripts/select_visual_model.py

      # ============================================================
      # GENERATE VISUALS
      # ============================================================
      - name: Generate visuals
        shell: bash
        run: |
          set -e
          python3 scripts/generate_visuals.py

      # ============================================================
      # FINAL ASSET INTEGRITY CHECK
      # ============================================================
      - name: Validate all assets before render
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "       FINAL PIPELINE INTEGRITY CHECK"
          echo "=============================================="

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = int(
              os.environ["EXPECTED_TOTAL"]
          )

          parts = int(
              os.environ["PARTS"]
          )

          scenes_per_part = int(
              os.environ["SCENES"]
          )

          # ------------------------------------------
          # SCENES
          # ------------------------------------------
          scenes_file = Path(
              "output/scenes/scenes.json"
          )

          if not scenes_file.exists():
              raise SystemExit(
                  "ERROR: scenes.json missing"
              )

          scenes = json.loads(
              scenes_file.read_text(
                  encoding="utf-8"
              )
          )

          scene_count = len(
              scenes.get("scenes", [])
          )

          print(
              f"Scenes: {scene_count}/{expected}"
          )

          if scenes.get("status") != "completed":
              raise SystemExit(
                  "ERROR: scenes.json is not completed."
              )

          if scene_count != expected:
              raise SystemExit(
                  f"ERROR: Expected {expected} scenes, "
                  f"found {scene_count}"
              )

          # ------------------------------------------
          # AUDIO
          #
          # IMPORTANT:
          # generate_tts.py writes here:
          # output/narration/audio/part_XX/scene_XX.mp3
          # ------------------------------------------
          audio_dir = Path(
              "output/narration/audio"
          )

          audio_files = sorted(
              list(audio_dir.rglob("*.mp3")) +
              list(audio_dir.rglob("*.wav"))
          )

          valid_audio = [
              p
              for p in audio_files
              if p.exists()
              and p.stat().st_size > 1000
          ]

          print(
              f"Audio files: "
              f"{len(valid_audio)}/{expected}"
          )

          if len(valid_audio) != expected:
              raise SystemExit(
                  f"ERROR: Expected {expected} audio files, "
                  f"found {len(valid_audio)}."
              )

          # ------------------------------------------
          # AUDIO MANIFEST
          # ------------------------------------------
          audio_manifest = Path(
              "output/narration/audio_jobs.json"
          )

          if not audio_manifest.exists():
              raise SystemExit(
                  "ERROR: audio_jobs.json missing."
              )

          audio_data = json.loads(
              audio_manifest.read_text(
                  encoding="utf-8"
              )
          )

          audio_jobs = audio_data.get(
              "jobs",
              []
          )

          completed_audio_jobs = [
              job
              for job in audio_jobs
              if job.get("status") == "completed"
          ]

          print(
              f"Audio jobs: "
              f"{len(audio_jobs)}/{expected}"
          )

          print(
              f"Completed audio jobs: "
              f"{len(completed_audio_jobs)}/{expected}"
          )

          if len(audio_jobs) != expected:
              raise SystemExit(
                  "ERROR: Audio job count mismatch."
              )

          if len(completed_audio_jobs) != expected:
              raise SystemExit(
                  "ERROR: Audio manifest incomplete."
              )

          # ------------------------------------------
          # VISUAL MANIFEST
          # ------------------------------------------
          visual_manifest = Path(
              "output/visuals/visual_jobs.json"
          )

          if not visual_manifest.exists():
              raise SystemExit(
                  "ERROR: visual_jobs.json missing."
              )

          visual_data = json.loads(
              visual_manifest.read_text(
                  encoding="utf-8"
              )
          )

          visual_jobs = visual_data.get(
              "jobs",
              []
          )

          completed_visual_jobs = [
              job
              for job in visual_jobs
              if job.get("status") == "completed"
          ]

          print(
              f"Visual jobs: "
              f"{len(visual_jobs)}/{expected}"
          )

          print(
              f"Completed visual jobs: "
              f"{len(completed_visual_jobs)}/{expected}"
          )

          if len(visual_jobs) != expected:
              raise SystemExit(
                  "ERROR: Visual job count mismatch."
              )

          if len(completed_visual_jobs) != expected:
              raise SystemExit(
                  "ERROR: Visual manifest incomplete."
              )

          # ------------------------------------------
          # PHYSICAL VISUAL FILES
          # ------------------------------------------
          visual_files = []

          for part in range(
              1,
              parts + 1
          ):
              for scene in range(
                  1,
                  scenes_per_part + 1
              ):

                  candidates = [
                      Path(
                          f"output/visuals/"
                          f"part_{part:02d}/"
                          f"scene_{scene:02d}.png"
                      ),
                      Path(
                          f"output/visuals/"
                          f"part_{part:02d}/"
                          f"scene_{scene:02d}.jpg"
                      ),
                      Path(
                          f"output/visuals/"
                          f"part_{part:02d}/"
                          f"scene_{scene:02d}.jpeg"
                      ),
                  ]

                  found = next(
                      (
                          p
                          for p in candidates
                          if p.exists()
                          and p.stat().st_size > 1000
                      ),
                      None
                  )

                  if found:
                      visual_files.append(
                          found
                      )
                  else:
                      raise SystemExit(
                          f"ERROR: Missing visual "
                          f"Part {part} Scene {scene}"
                      )

          print(
              f"Physical visuals: "
              f"{len(visual_files)}/{expected}"
          )

          if len(visual_files) != expected:
              raise SystemExit(
                  "ERROR: Physical visual count mismatch."
              )

          # ------------------------------------------
          # FINAL PASS
          # ------------------------------------------
          print()
          print(
              "=============================================="
          )
          print(
              "ALL PIPELINE ASSETS VALIDATED SUCCESSFULLY"
          )
          print(
              "=============================================="
          )

          print(
              f"Scenes  : {scene_count}/{expected}"
          )

          print(
              f"Audio   : {len(valid_audio)}/{expected}"
          )

          print(
              f"Visuals : {len(visual_files)}/{expected}"
          )

          print(
              "=============================================="
          )
          PY

      # ============================================================
      # THUMBNAILS
      # ============================================================
      - name: Install thumbnail dependencies
        shell: bash
        run: |
          set -e
          python3 -m pip install pillow

      - name: Generate thumbnails
        shell: bash
        run: |
          set -e
          python3 scripts/generate_thumbnail.py

      # ============================================================
      # YOUTUBE PACKAGE
      # MANUAL UPLOAD ONLY
      # ============================================================
      - name: Generate YouTube upload package
        shell: bash
        run: |
          set -e

          python3 scripts/generate_youtube_metadata.py

          echo
          echo "NOTE: YouTube upload remains MANUAL."
          echo "No automatic YouTube upload is performed."

      # ============================================================
      # RENDER
      # ============================================================
      - name: Render scene videos
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          STARTING VIDEO RENDER"
          echo "=============================================="

          python3 scripts/render_video.py

      # ============================================================
      # UPLOAD RENDERED VIDEOS
      # ============================================================
      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-rendered-videos
          path: output/rendered
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # ASSEMBLE FINAL VIDEO
      # ============================================================
      - name: Assemble final video
        shell: bash
        run: |
          set -e

          mkdir -p output/final

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          rendered = sorted(
              Path("output/rendered").glob("*.mp4")
          )

          if not rendered:
              raise SystemExit(
                  "ERROR: No rendered videos found."
              )

          list_file = Path(
              "output/final/concat.txt"
          )

          with list_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              for video in rendered:
                  safe = str(
                      video.resolve()
                  ).replace(
                      "'",
                      "'\\''"
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )

          output = Path(
              "output/final/lok-ai-final-video.mp4"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(list_file),
                  "-c",
                  "copy",
                  str(output),
              ],
              check=True,
          )

          if not output.exists():
              raise SystemExit(
                  "ERROR: Final video was not created."
              )

          if output.stat().st_size <= 0:
              raise SystemExit(
                  "ERROR: Final video is empty."
              )

          print(
              f"Final video: {output}"
          )

          print(
              f"Size: {output.stat().st_size} bytes"
          )
          PY

      # ============================================================
      # VALIDATE FINAL VIDEO
      # ============================================================
      - name: Validate final video
        shell: bash
        run: |
          set -e

          FINAL="output/final/lok-ai-final-video.mp4"

          test -s "$FINAL"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 \
            "$FINAL"

      # ============================================================
      # UPLOAD FINAL VIDEO
      # ============================================================
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-final-video
          path: output/final/lok-ai-final-video.mp4
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # PREPARE SUCCESSFUL CHECKPOINT
      # ============================================================
      - name: Prepare successful checkpoint
        shell: bash
        run: |
          set -e

          rm -rf /tmp/lok-ai-checkpoint

          mkdir -p \
            /tmp/lok-ai-checkpoint/output

          for dir in \
            config \
            checkpoints \
            story \
            scenes \
            narration \
            audio \
            visuals
          do

            if [ -d "output/$dir" ]; then

              mkdir -p \
                "/tmp/lok-ai-checkpoint/output/$dir"

              cp -a \
                "output/$dir/." \
                "/tmp/lok-ai-checkpoint/output/$dir/"

            fi

          done

          echo "Successful checkpoint prepared."

      # ============================================================
      # UPLOAD SUCCESSFUL CHECKPOINT
      # ============================================================
      - name: Upload successful checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-checkpoint
          path: /tmp/lok-ai-checkpoint
          if-no-files-found: error
          retention-days: 7
