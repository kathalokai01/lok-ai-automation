name: Generate AI Video

on:
  workflow_dispatch:
  push:
    paths:
      - "Input/topic.txt"
      - ".github/workflows/generate-video.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          READING CONFIGURATION"
          echo "======================================"

          test -f Input/topic.txt

          echo "===== INPUT/TOPIC.TXT ====="
          cat Input/topic.txt

          CONFIG="Input/topic.txt"

          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Validate configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        VALIDATING CONFIGURATION"
          echo "======================================"

          test -f "$CONFIG"

          if [ ! -s "$CONFIG" ]; then
            echo "ERROR: Configuration file is empty."
            exit 1
          fi

          echo "Configuration OK."

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p \
            output \
            output/story \
            output/structure \
            output/characters \
            output/scenes \
            output/narration \
            output/audio \
            output/visuals \
            output/parts \
            output/checkpoints

          echo "Directories prepared."

      - name: Generate story plan
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          STORY PLAN"
          echo "======================================"

          python3 scripts/generate_story_plan.py

      - name: Generate story structure
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        STORY STRUCTURE"
          echo "======================================"

          python3 scripts/generate_story_structure.py

      - name: Select Gemini Model
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          GEMINI MODEL"
          echo "======================================"

          python3 scripts/select_gemini_model.py

      - name: Test Gemini API
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "         TESTING GEMINI API"
          echo "======================================"

          python3 scripts/test_gemini_api.py

      - name: Prepare AI story generation
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "      PREPARING AI STORY GENERATION"
          echo "======================================"

          python3 scripts/prepare_ai_story.py

      - name: Generate Character Bible
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "        CHARACTER BIBLE"
          echo "======================================"

          python3 scripts/generate_character_bible.py

      - name: Generate Scenes
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "             SCENES"
          echo "======================================"

          python3 scripts/generate_scenes.py

      - name: Generate Narration
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "           NARRATION"
          echo "======================================"

          python3 scripts/generate_narration.py

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          INSTALLING FFMPEG"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Generate Hindi TTS Audio
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "          HINDI TTS AUDIO"
          echo "======================================"

          python3 scripts/generate_tts.py

      - name: Prepare Visual Generation
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       PREPARING VISUAL GENERATION"
          echo "======================================"

          python3 scripts/prepare_visual_generation.py

      - name: Select Cloudflare Visual Model
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       CLOUDFLARE VISUAL MODEL"
          echo "======================================"

          python3 scripts/select_cloudflare_model.py

      - name: Generate Visuals
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e

          echo "======================================"
          echo "          GENERATING VISUALS"
          echo "======================================"

          python3 scripts/generate_visuals.py

      - name: Render Scene Videos
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       RENDERING SCENE VIDEOS"
          echo "======================================"

          test -f scripts/render_video.py
          test -f output/narration/audio_jobs.json
          test -f output/visuals/visual_jobs.json

          python3 scripts/render_video.py

          echo
          echo "===== VIDEO RENDER MANIFEST ====="

          test -f output/video_render_manifest.json
          cat output/video_render_manifest.json

          echo
          echo "===== GENERATED PART VIDEOS ====="
          find output/parts -maxdepth 1 -type f -name "*.mp4" -print | sort

          echo
          echo "===== GENERATED SCENE VIDEOS ====="
          find output/scenes -type f -name "*.mp4" -print | sort

      - name: Upload Rendered Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-rendered-videos
          path: |
            output/scenes/**/*.mp4
            output/parts/*.mp4
            output/video_render_manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Final Video
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          ASSEMBLING FINAL VIDEO"
          echo "======================================"

          PART_COUNT=$(find output/parts -maxdepth 1 -type f -name "part_*.mp4" | wc -l)

          echo "Part videos found: $PART_COUNT"

          if [ "$PART_COUNT" -eq 0 ]; then
            echo "ERROR: No part videos found."
            exit 1
          fi

          rm -f \
            output/final_video_concat.txt \
            output/final_video.tmp.mp4 \
            output/final_video.mp4

          find output/parts \
            -maxdepth 1 \
            -type f \
            -name "part_*.mp4" \
            -print0 \
            | sort -z \
            | while IFS= read -r -d "" file; do

                if [ ! -s "$file" ]; then
                  echo "ERROR: Empty part video: $file"
                  exit 1
                fi

                printf "file '%s'\n" "$(realpath "$file")" \
                  >> output/final_video_concat.txt

              done

          echo
          echo "===== CONCAT LIST ====="
          cat output/final_video_concat.txt

          echo
          echo "===== FFMPEG FINAL ASSEMBLY ====="

          ffmpeg -y \
            -hide_banner \
            -loglevel error \
            -f concat \
            -safe 0 \
            -i output/final_video_concat.txt \
            -c copy \
            -movflags +faststart \
            output/final_video.tmp.mp4

          test -s output/final_video.tmp.mp4

          mv \
            output/final_video.tmp.mp4 \
            output/final_video.mp4

          echo
          echo "===== FINAL VIDEO ====="

          ls -lh output/final_video.mp4

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/final_video.mp4)

          echo "Final duration: ${DURATION}s"

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("output/final_video.mp4")
          render_manifest = Path("output/video_render_manifest.json")

          duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(video),
                  ],
                  text=True,
              ).strip()
          )

          if duration <= 0:
              raise SystemExit(
                  "ERROR: Final video duration is invalid."
              )

          data = json.loads(
              render_manifest.read_text(encoding="utf-8")
          )

          parts = data.get("parts", [])
          scenes = data.get("total_scenes", 0)

          if not parts:
              raise SystemExit(
                  "ERROR: Render manifest contains no parts."
              )

          final_manifest = {
              "status": "completed",
              "output": str(video),
              "duration": round(duration, 3),
              "parts": len(parts),
              "scenes": scenes,
              "format": data.get("format"),
              "width": data.get("width"),
              "height": data.get("height"),
              "fps": data.get("fps"),
          }

          Path(
              "output/final_video_manifest.json"
          ).write_text(
              json.dumps(
                  final_manifest,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  final_manifest,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Upload Final Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-final-video
          path: |
            output/final_video.mp4
            output/final_video_manifest.json
            output/video_render_manifest.json
            output/parts/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Create initial checkpoint
        shell: bash
        run: |
          set -e

          mkdir -p output/checkpoints

          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > output/checkpoints/initial_checkpoint.txt

          echo "Initial checkpoint created."

      - name: Show project state
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          PROJECT STATE"
          echo "======================================"

          find output \
            -maxdepth 3 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

      - name: Save checkpoint
        shell: bash
        run: |
          set -e

          mkdir -p output/checkpoints

          cat > output/checkpoints/latest_checkpoint.json <<'JSON'
          {
            "status": "completed",
            "pipeline": "ai-video-generation",
            "final_video": "output/final_video.mp4",
            "final_manifest": "output/final_video_manifest.json"
          }
          JSON

          echo "Checkpoint saved."
