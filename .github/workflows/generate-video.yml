name: Generate Lok AI Video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # VALIDATE REQUIRED SECRETS
      # ============================================================
      - name: Validate API secrets
        shell: bash
        run: |
          set -e

          echo "Checking required API secrets..."

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "ERROR: GEMINI_API_KEY is not set."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_R2_BUCKET:-}" ]; then
            echo "ERROR: CLOUDFLARE_R2_BUCKET is not set."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_R2_ACCESS_KEY_ID:-}" ]; then
            echo "ERROR: CLOUDFLARE_R2_ACCESS_KEY_ID is not set."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "ERROR: CLOUDFLARE_R2_SECRET_ACCESS_KEY is not set."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_R2_PUBLIC_URL:-}" ]; then
            echo "ERROR: CLOUDFLARE_R2_PUBLIC_URL is not set."
            exit 1
          fi

          echo "All required secrets are available."

      # ============================================================
      # READ PROJECT CONFIG
      # ============================================================
      - name: Read project config
        shell: bash
        run: |
          set -e

          if [ ! -f "Input/topic.txt" ]; then
            echo "ERROR: Input/topic.txt not found."
            exit 1
          fi

          if [ ! -f "scripts/input_config.py" ]; then
            echo "ERROR: scripts/input_config.py not found."
            exit 1
          fi

          echo "=============================================="
          echo "PROJECT CONFIG"
          echo "=============================================="

          cat Input/topic.txt

          echo
          echo "=============================================="
          echo "VALIDATING INPUT CONFIG"
          echo "=============================================="

          python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")

          from input_config import (
              load_input_config,
              validate_config,
              normalize_format,
              get_parts,
              get_scenes,
          )

          config = load_input_config()

          validate_config(config)

          fmt = normalize_format(config)
          parts = get_parts(config)
          scenes = get_scenes(config)

          print(f"FORMAT: {fmt}")
          print(f"PARTS: {parts}")
          print(f"SCENES: {scenes}")
          print("Input configuration is valid.")
          PY

          FORMAT=$(python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")

          from input_config import (
              load_input_config,
              normalize_format,
          )

          config = load_input_config()

          print(normalize_format(config))
          PY
          )

          if [ "$FORMAT" != "short" ] && [ "$FORMAT" != "full" ]; then
            echo "ERROR: FORMAT must be short or full."
            exit 1
          fi

          echo "FORMAT=$FORMAT" >> "$GITHUB_ENV"

          echo
          echo "Selected format: $FORMAT"
          echo "Read project config: SUCCESS"

      # ============================================================
      # PREPARE OUTPUT DIRECTORIES
      # ============================================================
      - name: Prepare output directories
        shell: bash
        run: |
          set -e

          mkdir -p output
          mkdir -p output/config
          mkdir -p output/checkpoints
          mkdir -p output/story
          mkdir -p output/scenes
          mkdir -p output/narration
          mkdir -p output/narration/audio
          mkdir -p output/audio
          mkdir -p output/visuals
          mkdir -p output/i2v
          mkdir -p output/parts
          mkdir -p output/thumbnail
          mkdir -p output/publish
          mkdir -p output/videos

      # ============================================================
      # EXPECTED TOTAL
      # ============================================================
      - name: Calculate expected scene count
        shell: bash
        run: |
          set -e

          readarray -t CONFIG_VALUES < <(
            python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")

          from input_config import (
              load_input_config,
              get_parts,
              get_scenes,
          )

          config = load_input_config()

          print(get_parts(config))
          print(get_scenes(config))
          PY
          )

          PARTS="${CONFIG_VALUES[0]}"
          SCENES="${CONFIG_VALUES[1]}"

          if ! [[ "$PARTS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid PARTS value."
            exit 1
          fi

          if ! [[ "$SCENES" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid SCENES value."
            exit 1
          fi

          EXPECTED_TOTAL=$((PARTS * SCENES))

          echo "PARTS=$PARTS" >> "$GITHUB_ENV"
          echo "SCENES_PER_PART=$SCENES" >> "$GITHUB_ENV"
          echo "EXPECTED_TOTAL=$EXPECTED_TOTAL" >> "$GITHUB_ENV"

          echo "Parts           : $PARTS"
          echo "Scenes per part : $SCENES"
          echo "Expected total  : $EXPECTED_TOTAL"

      # ============================================================
      # RESTORE PREVIOUS SUCCESSFUL CHECKPOINT
      # ============================================================
      - name: Restore previous successful checkpoint
        shell: bash
        run: |
          set -e

          CURRENT_RUN="${{ github.run_id }}"

          echo "Looking for previous successful checkpoint..."

          PREVIOUS_RUN_ID=$(gh run list \
            --workflow generate-video.yml \
            --limit 30 \
            --json databaseId,status,conclusion \
            --jq ".[] | select(.databaseId != ${CURRENT_RUN}) | select(.status == \"completed\") | select(.conclusion == \"success\") | .databaseId" \
            | head -n 1 || true)

          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo "No previous successful run found."
            exit 0
          fi

          echo "Previous successful run: $PREVIOUS_RUN_ID"

          rm -rf /tmp/lok-ai-checkpoint
          mkdir -p /tmp/lok-ai-checkpoint

          if gh run download "$PREVIOUS_RUN_ID" \
              --name lok-ai-successful-checkpoint \
              --dir /tmp/lok-ai-checkpoint; then

            echo "Checkpoint downloaded."

            if [ -d "/tmp/lok-ai-checkpoint/output" ]; then
              cp -a /tmp/lok-ai-checkpoint/output/. output/ || true
              echo "Checkpoint restored."
            else
              echo "Checkpoint does not contain output directory."
            fi

          else
            echo "No downloadable checkpoint found."
          fi

      # ============================================================
      # VALIDATE RESTORED TOPIC
      # ============================================================
      - name: Validate restored checkpoint
        shell: bash
        run: |
          set -e

          if [ ! -f "output/config/topic.txt" ]; then
            cp Input/topic.txt output/config/topic.txt
            echo "Fresh project configuration created."
            exit 0
          fi

          if cmp -s Input/topic.txt output/config/topic.txt; then
            echo "Restored checkpoint belongs to current input."
          else
            echo "Input changed. Removing stale downstream checkpoint."

            rm -rf \
              output/story \
              output/scenes \
              output/narration \
              output/visuals \
              output/i2v \
              output/parts \
              output/videos \
              output/thumbnail \
              output/publish

            mkdir -p \
              output/story \
              output/scenes \
              output/narration \
              output/narration/audio \
              output/visuals \
              output/i2v \
              output/parts \
              output/videos \
              output/thumbnail \
              output/publish

            cp Input/topic.txt output/config/topic.txt
          fi

      # ============================================================
      # VALIDATE SCENE CHECKPOINT
      # ============================================================
      - name: Validate scene checkpoint
        shell: bash
        run: |
          set -e

          SCENE_FILE="output/scenes/scenes.json"

          if [ ! -f "$SCENE_FILE" ]; then
            echo "No scene checkpoint found."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import sys

          path = "output/scenes/scenes.json"
          expected = int(os.environ["EXPECTED_TOTAL"])

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Invalid scenes.json: {e}")
              sys.exit(0)

          scenes = data.get("scenes", [])

          if data.get("status") != "completed":
              print("Scene checkpoint is not completed.")
              sys.exit(0)

          if len(scenes) != expected:
              print(
                  f"Scene checkpoint mismatch: "
                  f"{len(scenes)}/{expected}"
              )
              sys.exit(0)

          print(f"Scene checkpoint valid: {len(scenes)}/{expected}")
          PY

      # ============================================================
      # GENERATE STORY PLAN
      # ============================================================
      - name: Generate story plan
        shell: bash
        run: |
          set -e
          python3 scripts/generate_story_plan.py

      # ============================================================
      # GENERATE STORY
      # ============================================================
      - name: Generate story
        shell: bash
        run: |
          set -e
          python3 scripts/generate_story.py

      # ============================================================
      # SELECT GEMINI MODEL
      # ============================================================
      - name: Select Gemini model
        shell: bash
        run: |
          set -e
          python3 scripts/select_gemini_model.py

      # ============================================================
      # TEST GEMINI
      # ============================================================
      - name: Test Gemini
        shell: bash
        run: |
          set -e
          python3 scripts/test_gemini.py

      # ============================================================
      # GENERATE AI STORY
      # ============================================================
      - name: Generate AI story
        shell: bash
        run: |
          set -e
          python3 scripts/generate_ai_story.py

      # ============================================================
      # CHARACTER BIBLE
      # ============================================================
      - name: Generate character bible
        shell: bash
        run: |
          set -e
          python3 scripts/generate_character_bible.py

      # ============================================================
      # GENERATE SCENES
      # ============================================================
      - name: Generate scenes
        shell: bash
        run: |
          set -e

          python3 scripts/generate_scenes.py

          python3 - <<'PY'
          import json
          import os
          import sys

          path = "output/scenes/scenes.json"
          expected = int(os.environ["EXPECTED_TOTAL"])

          if not os.path.exists(path):
              print("ERROR: scenes.json not found.")
              sys.exit(1)

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          scenes = data.get("scenes", [])

          print(f"Scenes generated: {len(scenes)}/{expected}")

          if data.get("status") != "completed":
              print("ERROR: Scene generation is not completed.")
              sys.exit(1)

          if len(scenes) != expected:
              print("ERROR: Scene count mismatch.")
              sys.exit(1)
          PY

      # ============================================================
      # GENERATE NARRATION
      # ============================================================
      - name: Generate narration
        shell: bash
        run: |
          set -e
          python3 scripts/generate_narration.py

      # ============================================================
      # INSTALL ALL RUNTIME DEPENDENCIES
      # ============================================================
      - name: Install FFmpeg, TTS, Python and R2 dependencies
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "     INSTALLING PIPELINE DEPENDENCIES"
          echo "=============================================="

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          python3 -m pip install --upgrade pip

          python3 -m pip install --upgrade \
            requests \
            boto3 \
            edge-tts \
            pillow

          python3 - <<'PY'
          import requests
          print("requests:", requests.__version__)
          PY

          python3 - <<'PY'
          import boto3
          import botocore

          print("boto3:", boto3.__version__)
          print("botocore:", botocore.__version__)
          PY

          edge-tts --help >/dev/null
          echo "edge-tts: READY"

          python3 - <<'PY'
          from PIL import Image
          print("Pillow: READY")
          PY

          command -v ffmpeg
          command -v ffprobe
          command -v edge-tts

          echo "ALL DEPENDENCIES READY"

      # ============================================================
      # GENERATE HINDI TTS
      # ============================================================
      - name: Generate Hindi TTS
        shell: bash
        run: |
          set -e
          python3 scripts/generate_tts.py

      # ============================================================
      # PREPARE VISUAL GENERATION
      # ============================================================
      - name: Prepare visual generation
        shell: bash
        run: |
          set -e
          python3 scripts/prepare_visuals.py

      # ============================================================
      # SELECT CLOUDFLARE VISUAL MODEL
      # ============================================================
      - name: Select Cloudflare visual model
        shell: bash
        run: |
          set -e
          python3 scripts/select_visual_model.py

      # ============================================================
      # GENERATE VISUALS
      # ============================================================
      - name: Generate visuals
        shell: bash
        run: |
          set -e
          python3 scripts/generate_visuals.py

      # ============================================================
      # REAL AI IMAGE TO VIDEO
      # ============================================================
      - name: Generate real AI image-to-video clips
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "      GENERATING REAL AI VIDEO CLIPS"
          echo "=============================================="

          python3 scripts/generate_i2v.py

          echo
          echo "Generated I2V clips:"

          find output/i2v \
            -type f \
            -name "*.mp4" \
            -size +1000c \
            -print

          COUNT=$(find output/i2v \
            -type f \
            -name "*.mp4" \
            -size +1000c \
            | wc -l)

          echo
          echo "I2V clips: $COUNT/$EXPECTED_TOTAL"

          if [ "$COUNT" -ne "$EXPECTED_TOTAL" ]; then
            echo "ERROR: I2V clip count mismatch."
            exit 1
          fi

      # ============================================================
      # FINAL ASSET VALIDATION
      # ============================================================
      - name: Validate all assets before render
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "        FINAL ASSET VALIDATION"
          echo "=============================================="

          SCENE_COUNT=$(python3 - <<'PY'
          import json

          with open(
              "output/scenes/scenes.json",
              "r",
              encoding="utf-8"
          ) as f:
              print(len(json.load(f).get("scenes", [])))
          PY
          )

          AUDIO_COUNT=$(find output/narration/audio \
            -type f \
            -name "*.mp3" \
            -size +1000c \
            | wc -l)

          VISUAL_COUNT=$(find output/visuals \
            -type f \
            \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) \
            -size +1000c \
            | wc -l)

          I2V_COUNT=$(find output/i2v \
            -type f \
            -name "*.mp4" \
            -size +1000c \
            | wc -l)

          echo "Scenes : $SCENE_COUNT/$EXPECTED_TOTAL"
          echo "Audio  : $AUDIO_COUNT/$EXPECTED_TOTAL"
          echo "Visual : $VISUAL_COUNT/$EXPECTED_TOTAL"
          echo "I2V    : $I2V_COUNT/$EXPECTED_TOTAL"

          if [ "$SCENE_COUNT" -ne "$EXPECTED_TOTAL" ]; then
            echo "ERROR: Scene count mismatch."
            exit 1
          fi

          if [ "$AUDIO_COUNT" -ne "$EXPECTED_TOTAL" ]; then
            echo "ERROR: Audio count mismatch."
            exit 1
          fi

          if [ "$VISUAL_COUNT" -ne "$EXPECTED_TOTAL" ]; then
            echo "ERROR: Visual count mismatch."
            exit 1
          fi

          if [ "$I2V_COUNT" -ne "$EXPECTED_TOTAL" ]; then
            echo "ERROR: I2V count mismatch."
            exit 1
          fi

          echo "All assets validated successfully."

      # ============================================================
      # INSTALL THUMBNAIL DEPENDENCIES
      # ============================================================
      - name: Install thumbnail dependencies
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pillow

      # ============================================================
      # GENERATE THUMBNAILS
      # ============================================================
      - name: Generate thumbnails
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          GENERATING THUMBNAILS"
          echo "=============================================="

          if [ ! -f "scripts/generate_thumbnail.py" ]; then
            echo "ERROR: scripts/generate_thumbnail.py not found."
            exit 1
          fi

          python3 scripts/generate_thumbnail.py

          echo
          echo "Validating thumbnail outputs..."

          test -s "output/thumbnail/thumbnail_1280x720.jpg"
          test -s "output/thumbnail/thumbnail_1080x1920.jpg"
          test -s "output/thumbnail/thumbnail_manifest.json"

          echo "Thumbnail generation validated successfully."

      # ============================================================
      # GENERATE YOUTUBE PACKAGE
      # ============================================================
      - name: Generate YouTube upload package
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/generate_youtube_metadata.py" ]; then
            echo "ERROR: scripts/generate_youtube_metadata.py not found."
            exit 1
          fi

          python3 scripts/generate_youtube_metadata.py

          echo
          echo "Validating YouTube package..."

          test -s "output/publish/youtube_metadata.json"
          test -s "output/publish/youtube_title.txt"
          test -s "output/publish/youtube_description.txt"
          test -s "output/publish/youtube_tags.txt"

          echo "YouTube upload package validated successfully."

      # ============================================================
      # RENDER SCENE VIDEOS
      # ============================================================
      - name: Render scene videos
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          STARTING VIDEO RENDER"
          echo "=============================================="

          python3 scripts/render_video.py

      # ============================================================
      # VALIDATE RENDERED PARTS
      # ============================================================
      - name: Validate rendered videos
        shell: bash
        run: |
          set -e

          COUNT=$(find output/parts \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            -size +1000c \
            | wc -l)

          echo "Rendered part videos: $COUNT/$PARTS"

          if [ "$COUNT" -ne "$PARTS" ]; then
            echo "ERROR: Rendered part count mismatch."
            exit 1
          fi

      # ============================================================
      # UPLOAD RENDERED PART VIDEOS
      # ============================================================
      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-rendered-videos
          path: |
            output/parts/*.mp4
            output/scenes/**/*.mp4
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # ASSEMBLE FINAL VIDEO
      # ============================================================
      - name: Assemble final video
        shell: bash
        run: |
          set -e

          mkdir -p output/videos

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          parts = sorted(
              Path("output/parts").glob("*.mp4"),
              key=lambda p: int(
                  re.search(r'(\d+)', p.stem).group(1)
              )
          )

          if not parts:
              raise SystemExit("ERROR: No part videos found.")

          concat_file = Path("/tmp/concat.txt")

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              for part in parts:
                  f.write(
                      f"file '{part.resolve()}'\n"
                  )

          output = Path(
              "output/videos/final_video.mp4"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-c",
                  "copy",
                  "-movflags",
                  "+faststart",
                  str(output),
              ],
              check=True,
          )

          print(
              f"Final video created: {output}"
          )
          PY

      # ============================================================
      # VALIDATE FINAL VIDEO
      # ============================================================
      - name: Validate final video
        shell: bash
        run: |
          set -e

          FINAL="output/videos/final_video.mp4"

          if [ ! -s "$FINAL" ]; then
            echo "ERROR: Final video missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$FINAL")

          echo "Final video size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: Final video is too small."
            exit 1
          fi

          echo
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$FINAL"

      # ============================================================
      # UPLOAD FINAL VIDEO
      # ============================================================
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-final-video
          path: output/videos/final_video.mp4
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # PREPARE SUCCESSFUL CHECKPOINT
      # ============================================================
      - name: Prepare successful checkpoint
        if: success()
        shell: bash
        run: |
          set -e

          rm -rf /tmp/lok-ai-checkpoint
          mkdir -p /tmp/lok-ai-checkpoint/output

          for dir in \
            config \
            checkpoints \
            story \
            scenes \
            narration \
            visuals \
            i2v
          do
            if [ -d "output/$dir" ]; then
              mkdir -p \
                "/tmp/lok-ai-checkpoint/output/$dir"

              cp -a \
                "output/$dir/." \
                "/tmp/lok-ai-checkpoint/output/$dir/"
            fi
          done

          echo "Successful checkpoint prepared."

      # ============================================================
      # UPLOAD SUCCESSFUL CHECKPOINT
      # ============================================================
      - name: Upload successful checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-successful-checkpoint
          path: /tmp/lok-ai-checkpoint
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # SHOW FINAL OUTPUT
      # ============================================================
      - name: Show final output
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "              FINAL OUTPUT"
          echo "=============================================="

          echo
          echo "Videos:"
          find output/videos \
            -type f \
            -maxdepth 2 \
            -print 2>/dev/null || true

          echo
          echo "Parts:"
          find output/parts \
            -type f \
            -name "*.mp4" \
            -print 2>/dev/null || true

          echo
          echo "I2V:"
          find output/i2v \
            -type f \
            -name "*.mp4" \
            -print 2>/dev/null || true

          echo
          echo "Thumbnails:"
          find output/thumbnail \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "YouTube:"
          find output/publish \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "=============================================="
          echo "              WORKFLOW COMPLETE"
          echo "=============================================="
