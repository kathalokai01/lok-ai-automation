name: Generate Lok AI Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read configuration
        run: |
          echo "===== VIDEO CONFIGURATION ====="
          cat Input/topic.txt
          echo "==============================="

      - name: Validate configuration
        shell: bash
        run: |
          set -e

          CONFIG="Input/topic.txt"

          required_keys=(
            FORMAT
            AUDIENCE
            VOICE
            SPEED
            TOPIC
            PARTS
            SCENES
            STORY_LENGTH
            SCENE_DURATION
            CAPTIONS
            VISUAL_STYLE
            REALISM
            QUALITY
            FPS
            RESUME_ENABLED
            MAX_RETRIES
            SAVE_CHECKPOINT_AFTER_EACH_SCENE
            SKIP_COMPLETED_SCENES
            FAILURE_POLICY
          )

          for key in "${required_keys[@]}"; do
            if ! grep -qE "^${key}[[:space:]]*=" "$CONFIG"; then
              echo "ERROR: Missing configuration key: $key"
              exit 1
            fi
          done

          echo "Configuration validation: PASSED"

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p output
          mkdir -p output/config
          mkdir -p output/checkpoints
          mkdir -p output/scenes
          mkdir -p output/parts
          mkdir -p output/shorts
          mkdir -p output/story
          mkdir -p output/narration
          mkdir -p output/narration/audio
          mkdir -p output/visuals

      - name: Generate story plan
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story_plan.py
          cat output/story/story_plan.json

      - name: Generate story structure
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story.py
          cat output/story/story.json

      - name: Select Gemini Model
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/select_gemini_model.py
          cat output/config/selected_model.json

      - name: Test Gemini API
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/test_gemini.py

      - name: Prepare AI story generation
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_ai_story.py
          cat output/story/ai_story.json

      - name: Generate Character Bible
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_character_bible.py
          cat output/story/character_bible.json

      - name: Generate Scenes
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_scenes.py
          cat output/scenes/scenes.json

      - name: Generate Narration
        shell: bash
        run: |
          set -e

          python3 scripts/generate_narration.py
          cat output/narration/narration.json

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 1

          echo "===== FFprobe ====="
          ffprobe -version | head -n 1

      - name: Generate Hindi TTS Audio
        shell: bash
        run: |
          set +e

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            edge-tts

          INSTALL_STATUS=$?

          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "ERROR: Edge TTS installation failed."
            exit "$INSTALL_STATUS"
          fi

          python3 scripts/generate_tts.py

          TTS_STATUS=$?

          if [ -f output/narration/audio_jobs.json ]; then
            echo "===== TTS MANIFEST ====="
            cat output/narration/audio_jobs.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/narration/audio_jobs.json

          if git diff --cached --quiet; then
            echo "No TTS checkpoint changes to commit."
          else
            git commit -m "Checkpoint TTS audio generation"
            git push
          fi

          if [ "$TTS_STATUS" -ne 0 ]; then
            echo "TTS generation failed."
            echo "Checkpoint was saved before stopping."
            exit "$TTS_STATUS"
          fi

      - name: Prepare Visual Generation
        shell: bash
        run: |
          set -e

          python3 scripts/prepare_visuals.py
          cat output/visuals/visual_jobs.json

      - name: Select Cloudflare Visual Model
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          python3 scripts/select_visual_model.py
          cat output/config/selected_visual_model.json

      - name: Generate Visuals
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e

          python3 scripts/generate_visuals.py

          GENERATION_STATUS=$?

          if [ -f output/visuals/visual_jobs.json ]; then
            echo "===== VISUAL MANIFEST ====="
            cat output/visuals/visual_jobs.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/visuals/visual_jobs.json

          if git diff --cached --quiet; then
            echo "No visual checkpoint changes to commit."
          else
            git commit -m "Checkpoint visual generation"
            git push
          fi

          if [ "$GENERATION_STATUS" -ne 0 ]; then
            echo "Visual generation failed."
            echo "Checkpoint was saved before stopping."
            exit "$GENERATION_STATUS"
          fi

      - name: Render Scene Videos
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       RENDERING SCENE VIDEOS"
          echo "======================================"

          test -f scripts/render_video.py
          test -f output/narration/audio_jobs.json
          test -f output/visuals/visual_jobs.json

          python3 scripts/render_video.py

          echo
          echo "===== VIDEO RENDER MANIFEST ====="

          test -f output/video_render_manifest.json
          cat output/video_render_manifest.json

          echo
          echo "===== GENERATED PART VIDEOS ====="
          find output/parts -maxdepth 1 -type f -name "*.mp4" -print | sort

          echo
          echo "===== GENERATED SCENE VIDEOS ====="
          find output/scenes -type f -name "*.mp4" -print | sort

      - name: Upload Rendered Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-rendered-videos
          path: |
            output/scenes/**/*.mp4
            output/parts/*.mp4
            output/video_render_manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Create initial checkpoint
        shell: bash
        run: |
          set -e

          CHECKPOINT="output/checkpoints/progress.json"

          if [ -f "$CHECKPOINT" ]; then
            cat "$CHECKPOINT"
          else
            cat > "$CHECKPOINT" <<'EOF'
          {
            "status": "initialized",
            "completed_parts": [],
            "completed_scenes": [],
            "current_part": 1,
            "current_scene": 1,
            "last_completed": null
          }
          EOF
          fi

      - name: Show project state
        run: |
          echo "===== OUTPUT FILES ====="
          find output -maxdepth 5 -type f | sort

      - name: Save checkpoint
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/config/selected_model.json \
            output/config/selected_visual_model.json \
            output/checkpoints/progress.json \
            output/story/story_plan.json \
            output/story/story.json \
            output/story/ai_story.json \
            output/story/character_bible.json \
            output/scenes/scenes.json \
            output/narration/narration.json \
            output/narration/audio_jobs.json \
            output/visuals/visual_jobs.json \
            output/video_render_manifest.json

          if git diff --cached --quiet; then
            echo "No checkpoint changes to commit."
          else
            git commit -m "Save video pipeline checkpoint"
            git push
          fi
