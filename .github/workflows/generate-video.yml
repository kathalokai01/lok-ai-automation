name: Generate Lok AI Video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. READ CONFIG
      # ============================================================

      - name: Read configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          LOK AI VIDEO PIPELINE"
          echo "=============================================="

          cat Input/topic.txt

          echo "=============================================="


      # ============================================================
      # 3. PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p \
            output/config \
            output/checkpoints \
            output/scenes \
            output/parts \
            output/shorts \
            output/story \
            output/narration/audio \
            output/visuals \
            output/thumbnail \
            output/publish


      # ============================================================
      # 4. VALIDATE CONFIG
      # ============================================================

      - name: Validate configuration
        shell: bash
        run: |
          set -e

          CONFIG="Input/topic.txt"

          required_keys=(
            FORMAT
            AUDIENCE
            VOICE
            SPEED
            TOPIC
            PARTS
            SCENES
            STORY_LENGTH
            SCENE_DURATION
            CAPTIONS
            VISUAL_STYLE
            REALISM
            QUALITY
            FPS
            RESUME_ENABLED
            MAX_RETRIES
            SAVE_CHECKPOINT_AFTER_EACH_SCENE
            SKIP_COMPLETED_SCENES
            FAILURE_POLICY
          )

          for key in "${required_keys[@]}"; do
            grep -qE "^${key}[[:space:]]*=" "$CONFIG" || {
              echo "ERROR: Missing configuration key: $key"
              exit 1
            }
          done

          echo "Configuration validation: PASSED"


      # ============================================================
      # 5. RESTORE ONLY SUCCESSFUL CHECKPOINT
      # ============================================================

      - name: Restore Safe Checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=============================================="
          echo "       SAFE CHECKPOINT RESTORE"
          echo "=============================================="

          CURRENT_RUN="${{ github.run_id }}"

          EXPECTED_PARTS=$(grep '^PARTS[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_SCENES=$(grep '^SCENES[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_TOTAL=$((EXPECTED_PARTS * EXPECTED_SCENES))

          echo "Expected parts : $EXPECTED_PARTS"
          echo "Expected scenes: $EXPECTED_SCENES"
          echo "Expected total : $EXPECTED_TOTAL"

          echo
          echo "Searching ONLY successful previous runs..."

          PREVIOUS_RUN_ID=$(gh run list \
            --workflow generate-video.yml \
            --limit 30 \
            --json databaseId,status,conclusion \
            --jq ".[] |
              select(.databaseId != ${CURRENT_RUN}) |
              select(.status == \"completed\") |
              select(.conclusion == \"success\") |
              .databaseId" \
            | head -n 1)

          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo "No successful previous run found."
            echo "Starting fresh."
            exit 0
          fi

          echo "Successful checkpoint source: $PREVIOUS_RUN_ID"

          rm -rf /tmp/lok-ai-checkpoint
          mkdir -p /tmp/lok-ai-checkpoint

          if ! gh run download "$PREVIOUS_RUN_ID" \
            --name lok-ai-checkpoint \
            --dir /tmp/lok-ai-checkpoint; then

            echo "Checkpoint artifact unavailable."
            echo "Starting fresh."
            exit 0
          fi

          if [ ! -d "/tmp/lok-ai-checkpoint/output" ]; then
            echo "Invalid checkpoint layout."
            echo "Starting fresh."
            exit 0
          fi

          rm -rf output/*

          cp -a \
            /tmp/lok-ai-checkpoint/output/. \
            output/

          echo
          echo "Checkpoint restored."


      # ============================================================
      # 6. CHECKPOINT TOPIC
      # ============================================================

      - name: Validate restored checkpoint topic
        shell: bash
        run: |
          set -e

          CURRENT_TOPIC=$(grep '^TOPIC[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | sed 's/^"//;s/"$//')

          RESTORED_TOPIC=$(python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("output/story/story_plan.json")

          if not p.exists():
              print("")
              raise SystemExit

          try:
              data = json.loads(
                  p.read_text(encoding="utf-8")
              )
              print(str(data.get("topic", "")))
          except Exception:
              print("")
          PY
          )

          echo "Current topic : $CURRENT_TOPIC"
          echo "Restored topic: $RESTORED_TOPIC"

          if [ -n "$RESTORED_TOPIC" ] && \
             [ "$CURRENT_TOPIC" != "$RESTORED_TOPIC" ]; then

            echo "Topic mismatch."
            echo "Removing restored checkpoint."

            rm -rf output/*

            mkdir -p \
              output/config \
              output/checkpoints \
              output/scenes \
              output/parts \
              output/shorts \
              output/story \
              output/narration/audio \
              output/visuals \
              output/thumbnail \
              output/publish
          fi


      # ============================================================
      # 7. STORY PLAN
      # ============================================================

      - name: Generate Story Plan
        shell: bash
        run: |
          set -e

          if [ -s output/story/story_plan.json ]; then
            echo "Story plan checkpoint found."
          else
            python3 scripts/generate_story_plan.py
          fi

          test -s output/story/story_plan.json


      # ============================================================
      # 8. STORY
      # ============================================================

      - name: Generate Story
        shell: bash
        run: |
          set -e

          if [ -s output/story/story.json ]; then
            echo "Story checkpoint found."
          else
            python3 scripts/generate_story.py
          fi

          test -s output/story/story.json


      # ============================================================
      # 9. GEMINI MODEL
      # ============================================================

      - name: Select Gemini Model
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -s output/config/selected_model.json ]; then
            echo "Gemini model checkpoint found."
          else
            python3 scripts/select_gemini_model.py
          fi

          test -s output/config/selected_model.json


      # ============================================================
      # 10. GEMINI TEST
      # ============================================================

      - name: Test Gemini API
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -s output/story/ai_story.json ]; then
            echo "AI story checkpoint found."
          else
            python3 scripts/test_gemini.py
          fi


      # ============================================================
      # 11. AI STORY
      # ============================================================

      - name: Generate AI Story
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          VALID=0

          if [ -s output/story/ai_story.json ]; then
            VALID=$(python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              d = json.loads(
                  Path("output/story/ai_story.json")
                  .read_text(encoding="utf-8")
              )

              print(
                  1 if d.get("status") == "completed"
                  else 0
              )

          except Exception:
              print(0)
          PY
            )
          fi

          if [ "$VALID" -eq 1 ]; then
            echo "Valid AI story checkpoint found."
          else
            rm -f output/story/ai_story.json
            python3 scripts/generate_ai_story.py
          fi

          test -s output/story/ai_story.json


      # ============================================================
      # 12. CHARACTER BIBLE
      # ============================================================

      - name: Generate Character Bible
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -s output/story/character_bible.json ]; then
            echo "Character Bible checkpoint found."
          else
            python3 scripts/generate_character_bible.py
          fi

          test -s output/story/character_bible.json


      # ============================================================
      # 13. SCENES — STRICT 44-SCENE VALIDATION
      # ============================================================

      - name: Generate Scenes
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          EXPECTED_PARTS=$(grep '^PARTS[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_SCENES=$(grep '^SCENES[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_TOTAL=$((EXPECTED_PARTS * EXPECTED_SCENES))

          VALID=0

          if [ -s output/scenes/scenes.json ]; then

            VALID=$(python3 - "$EXPECTED_TOTAL" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = int(sys.argv[1])

          try:
              data = json.loads(
                  Path("output/scenes/scenes.json")
                  .read_text(encoding="utf-8")
              )

              scenes = data.get("scenes", [])

              if (
                  data.get("status") == "completed"
                  and len(scenes) == expected
              ):
                  print(1)
              else:
                  print(0)

          except Exception:
              print(0)
          PY
            )

          fi

          if [ "$VALID" -eq 1 ]; then

            echo "Valid scenes checkpoint found."
            echo "Scenes: $EXPECTED_TOTAL"

          else

            echo "Invalid or incomplete scenes checkpoint."
            echo "Regenerating scenes."

            rm -f output/scenes/scenes.json
            rm -f output/scenes/checkpoint.json

            python3 scripts/generate_scenes.py

          fi

          python3 - "$EXPECTED_TOTAL" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = int(sys.argv[1])

          data = json.loads(
              Path("output/scenes/scenes.json")
              .read_text(encoding="utf-8")
          )

          scenes = data.get("scenes", [])

          if data.get("status") != "completed":
              raise SystemExit(
                  "ERROR: scenes.json is not completed"
              )

          if len(scenes) != expected:
              raise SystemExit(
                  f"ERROR: Scene count {len(scenes)} "
                  f"!= expected {expected}"
              )

          print(
              f"SCENE CHECK PASSED: "
              f"{len(scenes)} / {expected}"
          )
          PY


      # ============================================================
      # 14. NARRATION
      # ============================================================

      - name: Generate Narration
        shell: bash
        run: |
          set -e

          EXPECTED_PARTS=$(grep '^PARTS[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_SCENES=$(grep '^SCENES[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_TOTAL=$((EXPECTED_PARTS * EXPECTED_SCENES))

          VALID=0

          if [ -s output/narration/narration.json ]; then

            VALID=$(python3 - "$EXPECTED_TOTAL" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = int(sys.argv[1])

          try:
              data = json.loads(
                  Path("output/narration/narration.json")
                  .read_text(encoding="utf-8")
              )

              items = data.get(
                  "narration",
                  data.get("scenes", [])
              )

              if (
                  data.get("status") == "completed"
                  and len(items) == expected
              ):
                  print(1)
              else:
                  print(0)

          except Exception:
              print(0)
          PY
            )

          fi

          if [ "$VALID" -eq 1 ]; then

            echo "Valid narration checkpoint found."

          else

            echo "Regenerating narration."

            rm -f output/narration/narration.json

            python3 scripts/generate_narration.py

          fi

          test -s output/narration/narration.json


      # ============================================================
      # 15. FFMPEG
      # ============================================================

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1


      # ============================================================
      # 16. TTS
      # ============================================================

      - name: Generate Hindi TTS Audio
        shell: bash
        run: |
          set -e

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            edge-tts

          python3 scripts/generate_tts.py

          test -s output/narration/audio_jobs.json


      # ============================================================
      # 17. PREPARE VISUALS
      # ============================================================

      - name: Prepare Visual Generation
        shell: bash
        run: |
          set -e

          python3 scripts/prepare_visuals.py

          test -s output/visuals/visual_jobs.json


      # ============================================================
      # 18. SELECT CLOUDFLARE MODEL
      # ============================================================

      - name: Select Cloudflare Visual Model
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          if [ -s output/config/selected_visual_model.json ]; then
            echo "Visual model checkpoint found."
          else
            python3 scripts/select_visual_model.py
          fi

          test -s output/config/selected_visual_model.json


      # ============================================================
      # 19. GENERATE VISUALS
      # ============================================================

      - name: Generate Visuals
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          python3 scripts/generate_visuals.py

          test -s output/visuals/visual_jobs.json


      # ============================================================
      # 20. FINAL VISUAL + MANIFEST GATE
      # ============================================================

      - name: Validate Complete Pipeline
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "        FINAL PIPELINE INTEGRITY GATE"
          echo "=============================================="

          EXPECTED_PARTS=$(grep '^PARTS[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_SCENES=$(grep '^SCENES[[:space:]]*=' Input/topic.txt \
            | head -n 1 \
            | sed 's/^[^=]*=[[:space:]]*//' \
            | tr -d "\"' ")

          EXPECTED_TOTAL=$((EXPECTED_PARTS * EXPECTED_SCENES))

          echo "Expected scenes: $EXPECTED_TOTAL"

          # -------------------------------
          # SCENES
          # -------------------------------

          python3 - "$EXPECTED_TOTAL" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = int(sys.argv[1])

          data = json.loads(
              Path("output/scenes/scenes.json")
              .read_text(encoding="utf-8")
          )

          scenes = data.get("scenes", [])

          if data.get("status") != "completed":
              raise SystemExit(
                  "ERROR: scenes.json not completed"
              )

          if len(scenes) != expected:
              raise SystemExit(
                  f"ERROR: scenes = {len(scenes)}, "
                  f"expected = {expected}"
              )

          print("Scenes: PASS")
          PY

          # -------------------------------
          # AUDIO
          # -------------------------------

          AUDIO_COUNT=$(find output/narration/audio \
            -type f \
            -name '*.mp3' \
            -size +0c \
            2>/dev/null | wc -l)

          echo "Audio files: $AUDIO_COUNT / $EXPECTED_TOTAL"

          if [ "$AUDIO_COUNT" -ne "$EXPECTED_TOTAL" ]; then
            echo "ERROR: Audio count mismatch."
            exit 1
          fi

          # -------------------------------
          # VISUAL MANIFEST
          # -------------------------------

          python3 - "$EXPECTED_TOTAL" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = int(sys.argv[1])

          data = json.loads(
              Path("output/visuals/visual_jobs.json")
              .read_text(encoding="utf-8")
          )

          jobs = data.get("jobs", [])

          completed = [
              j for j in jobs
              if j.get("status") == "completed"
          ]

          if len(jobs) != expected:
              raise SystemExit(
                  f"ERROR: visual jobs = {len(jobs)}, "
                  f"expected = {expected}"
              )

          if len(completed) != expected:
              raise SystemExit(
                  f"ERROR: completed visuals = "
                  f"{len(completed)}, "
                  f"expected = {expected}"
              )

          print("Visual manifest: PASS")
          PY

          # -------------------------------
          # PHYSICAL VISUAL FILES
          # -------------------------------

          ACTUAL_TOTAL=$(find output/visuals \
            -type f \
            \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) \
            -size +0c \
            2>/dev/null | wc -l)

          echo "Visual files: $ACTUAL_TOTAL / $EXPECTED_TOTAL"

          if [ "$ACTUAL_TOTAL" -ne "$EXPECTED_TOTAL" ]; then
            echo "ERROR: Physical visual count mismatch."

            for part in $(seq 1 "$EXPECTED_PARTS"); do
              for scene in $(seq 1 "$EXPECTED_SCENES"); do

                FILE="output/visuals/part_$(printf '%02d' "$part")/scene_$(printf '%02d' "$scene").png"

                if [ ! -s "$FILE" ]; then
                  echo "MISSING: Part $part Scene $scene"
                fi

              done
            done

            exit 1
          fi

          echo
          echo "=============================================="
          echo "       PIPELINE INTEGRITY GATE PASSED"
          echo "=============================================="
          echo "Scenes : $EXPECTED_TOTAL"
          echo "Audio  : $EXPECTED_TOTAL"
          echo "Visual : $EXPECTED_TOTAL"
          echo "=============================================="


      # ============================================================
      # 21. THUMBNAILS
      # ============================================================

      - name: Install Thumbnail Dependencies
        shell: bash
        run: |
          set -e

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            Pillow

          sudo apt-get update
          sudo apt-get install -y fonts-noto-core


      - name: Generate Thumbnail
        shell: bash
        run: |
          set -e

          python3 scripts/generate_thumbnail.py

          test -s output/thumbnail/thumbnail_1280x720.jpg
          test -s output/thumbnail/thumbnail_1080x1920.jpg


      # ============================================================
      # 22. YOUTUBE PACKAGE — NO AUTO UPLOAD
      # ============================================================

      - name: Generate YouTube Upload Package
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_youtube_metadata.py

          test -s output/publish/youtube_metadata.json
          test -s output/publish/youtube_title.txt
          test -s output/publish/youtube_description.txt
          test -s output/publish/youtube_tags.txt

          echo "YouTube package generated."
          echo "Automatic YouTube upload is disabled."


      # ============================================================
      # 23. RENDER
      # ============================================================

      - name: Render Scene Videos
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          STARTING VIDEO RENDER"
          echo "=============================================="

          python3 scripts/render_video.py

          test -s output/video_render_manifest.json

          echo "Render completed."


      # ============================================================
      # 24. UPLOAD RENDERED ARTIFACT
      # ============================================================

      - name: Upload Rendered Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-rendered-videos
          path: |
            output/scenes/**/*.mp4
            output/parts/*.mp4
            output/video_render_manifest.json
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 25. ASSEMBLE FINAL VIDEO
      # ============================================================

      - name: Assemble Final Video
        shell: bash
        run: |
          set -e

          rm -f \
            output/final_video_concat.txt \
            output/final_video.tmp.mp4 \
            output/final_video.mp4

          find output/parts \
            -maxdepth 1 \
            -type f \
            -name 'part_*.mp4' \
            -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do

              test -s "$file"

              printf "file '%s'\n" \
                "$(realpath "$file")" \
                >> output/final_video_concat.txt

          done

          test -s output/final_video_concat.txt

          ffmpeg \
            -y \
            -hide_banner \
            -loglevel error \
            -f concat \
            -safe 0 \
            -i output/final_video_concat.txt \
            -c copy \
            -movflags +faststart \
            output/final_video.tmp.mp4

          test -s output/final_video.tmp.mp4

          mv \
            output/final_video.tmp.mp4 \
            output/final_video.mp4

          echo "Final video assembled."


      # ============================================================
      # 26. FINAL VALIDATION
      # ============================================================

      - name: Validate Final Video
        shell: bash
        run: |
          set -e

          test -s output/final_video.mp4

          SIZE=$(stat -c%s output/final_video.mp4)

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Final video suspiciously small."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_type,codec_name,width,height \
            -show_entries \
            format=duration \
            -of json \
            output/final_video.mp4

          echo
          echo "FINAL VIDEO VALIDATION PASSED"


      # ============================================================
      # 27. FINAL ARTIFACT
      # ============================================================

      - name: Upload Final Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-final-video
          path: |
            output/final_video.mp4
            output/video_render_manifest.json
            output/thumbnail/thumbnail_1280x720.jpg
            output/thumbnail/thumbnail_1080x1920.jpg
            output/publish/youtube_metadata.json
            output/publish/youtube_title.txt
            output/publish/youtube_description.txt
            output/publish/youtube_tags.txt
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 28. PREPARE SUCCESS CHECKPOINT
      # ============================================================

      - name: Prepare Resume Checkpoint
        shell: bash
        run: |
          set -e

          rm -rf /tmp/lok-ai-checkpoint

          mkdir -p /tmp/lok-ai-checkpoint/output

          cp -a output/config \
            /tmp/lok-ai-checkpoint/output/

          cp -a output/checkpoints \
            /tmp/lok-ai-checkpoint/output/

          cp -a output/story \
            /tmp/lok-ai-checkpoint/output/

          cp -a output/scenes \
            /tmp/lok-ai-checkpoint/output/

          cp -a output/narration \
            /tmp/lok-ai-checkpoint/output/

          cp -a output/visuals \
            /tmp/lok-ai-checkpoint/output/

          echo "SUCCESS CHECKPOINT READY"

          find /tmp/lok-ai-checkpoint/output \
            -maxdepth 6 \
            -type f \
            | sort


      # ============================================================
      # 29. CHECKPOINT ARTIFACT
      # IMPORTANT: ONLY SUCCESSFUL RUN GETS THIS ARTIFACT
      # ============================================================

      - name: Upload Workflow Checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-checkpoint
          path: /tmp/lok-ai-checkpoint
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 30. PROJECT STATE
      # ============================================================

      - name: Show project state
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo "              PROJECT STATE"
          echo "=============================================="

          find output \
            -maxdepth 6 \
            -type f \
            | sort || true

          echo
          echo "Pipeline finished."
