name: Generate Lok AI Video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. READ CONFIG
      # ======================================================

      - name: Read project configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          PROJECT CONFIGURATION"
          echo "=============================================="

          TOPIC=$(sed -n 's/^[[:space:]]*TOPIC[[:space:]]*=[[:space:]]*"\(.*\)".*$/\1/p' Input/topic.txt | head -n 1)

          PARTS=$(sed -n 's/^[[:space:]]*PARTS[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' Input/topic.txt | head -n 1)

          SCENES=$(sed -n 's/^[[:space:]]*SCENES[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' Input/topic.txt | head -n 1)

          if [ -z "$PARTS" ]; then
            echo "ERROR: PARTS could not be read."
            exit 1
          fi

          if [ -z "$SCENES" ]; then
            echo "ERROR: SCENES could not be read."
            exit 1
          fi

          if ! [[ "$PARTS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid PARTS: $PARTS"
            exit 1
          fi

          if ! [[ "$SCENES" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid SCENES: $SCENES"
            exit 1
          fi

          TOTAL=$((PARTS * SCENES))

          echo "TOPIC : $TOPIC"
          echo "PARTS : $PARTS"
          echo "SCENES PER PART : $SCENES"
          echo "TOTAL SCENES : $TOTAL"

          echo "TOPIC=$TOPIC" >> "$GITHUB_ENV"
          echo "PARTS=$PARTS" >> "$GITHUB_ENV"
          echo "SCENES=$SCENES" >> "$GITHUB_ENV"
          echo "EXPECTED_TOTAL=$TOTAL" >> "$GITHUB_ENV"

          echo "=============================================="


      # ======================================================
      # 3. PREPARE DIRECTORIES
      # ======================================================

      - name: Prepare output directories
        shell: bash
        run: |
          set -e

          mkdir -p \
            output/config \
            output/story \
            output/scenes \
            output/narration \
            output/audio \
            output/visuals \
            output/thumbnails \
            output/publish \
            output/rendered \
            output/checkpoints


      # ======================================================
      # 4. RESTORE ONLY SUCCESSFUL CHECKPOINT
      # ======================================================

      - name: Restore previous successful checkpoint
        shell: bash
        run: |
          set -e

          CURRENT_RUN="${{ github.run_id }}"

          echo "Looking for previous SUCCESSFUL workflow..."

          PREVIOUS_RUN_ID=$(gh run list \
            --workflow generate-video.yml \
            --limit 30 \
            --json databaseId,status,conclusion \
            --jq ".[] |
              select(.databaseId != ${CURRENT_RUN}) |
              select(.status == \"completed\") |
              select(.conclusion == \"success\") |
              .databaseId" \
            | head -n 1)

          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo "No previous successful run found."
            exit 0
          fi

          echo "Previous successful run: $PREVIOUS_RUN_ID"

          rm -rf /tmp/lok-ai-checkpoint
          mkdir -p /tmp/lok-ai-checkpoint

          if gh run download "$PREVIOUS_RUN_ID" \
              --name lok-ai-checkpoint \
              --dir /tmp/lok-ai-checkpoint; then

            echo "Checkpoint downloaded."

            if [ -d "/tmp/lok-ai-checkpoint/output" ]; then
              cp -a /tmp/lok-ai-checkpoint/output/. output/
              echo "Checkpoint restored."
            else
              echo "WARNING: Checkpoint output directory missing."
            fi

          else
            echo "No checkpoint artifact available."
          fi


      # ======================================================
      # 5. GENERATE STORY PLAN
      # ======================================================

      - name: Generate story plan
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story_plan.py


      # ======================================================
      # 6. GENERATE STORY
      # ======================================================

      - name: Generate story
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story.py


      # ======================================================
      # 7. SELECT GEMINI MODEL
      # ======================================================

      - name: Select Gemini model
        shell: bash
        run: |
          set -e

          python3 scripts/select_gemini_model.py


      # ======================================================
      # 8. TEST GEMINI
      # ======================================================

      - name: Test Gemini
        shell: bash
        run: |
          set -e

          python3 scripts/test_gemini.py


      # ======================================================
      # 9. GENERATE AI STORY
      # ======================================================

      - name: Generate AI story
        shell: bash
        run: |
          set -e

          python3 scripts/generate_ai_story.py


      # ======================================================
      # 10. CHARACTER BIBLE
      # ======================================================

      - name: Generate character bible
        shell: bash
        run: |
          set -e

          python3 scripts/generate_character_bible.py


      # ======================================================
      # 11. GENERATE SCENES
      # ======================================================

      - name: Generate scenes
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          GENERATING SCENES"
          echo "=============================================="

          python3 scripts/generate_scenes.py

          echo
          echo "Scene generation completed."

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("output/scenes/scenes.json")

          if not p.exists():
              raise SystemExit("ERROR: scenes.json missing")

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          expected = int("${{ env.EXPECTED_TOTAL }}")

          actual = len(
              data.get("scenes", [])
          )

          status = data.get("status")

          print(f"Scene status : {status}")
          print(f"Expected     : {expected}")
          print(f"Actual       : {actual}")

          if status != "completed":
              raise SystemExit(
                  "ERROR: scenes.json is not completed"
              )

          if actual != expected:
              raise SystemExit(
                  f"ERROR: Expected {expected} scenes, found {actual}"
              )

          print("SCENE VALIDATION: PASS")
          PY


      # ======================================================
      # 12. NARRATION
      # ======================================================

      - name: Generate narration
        shell: bash
        run: |
          set -e

          python3 scripts/generate_narration.py


      # ======================================================
      # 13. FFMPEG
      # ======================================================

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ======================================================
      # 14. TTS
      # ======================================================

      - name: Generate Hindi TTS
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts

          python3 scripts/generate_tts.py


      # ======================================================
      # 15. PREPARE VISUALS
      # ======================================================

      - name: Prepare visual generation
        shell: bash
        run: |
          set -e

          python3 scripts/prepare_visuals.py


      # ======================================================
      # 16. SELECT VISUAL MODEL
      # ======================================================

      - name: Select Cloudflare visual model
        shell: bash
        run: |
          set -e

          python3 scripts/select_visual_model.py


      # ======================================================
      # 17. GENERATE VISUALS
      # ======================================================

      - name: Generate visuals
        shell: bash
        run: |
          set -e

          python3 scripts/generate_visuals.py


      # ======================================================
      # 18. FINAL PIPELINE INTEGRITY
      # ======================================================

      - name: Validate all assets before render
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "       FINAL PIPELINE INTEGRITY CHECK"
          echo "=============================================="

          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = int("${{ env.EXPECTED_TOTAL }}")

          # ----------------------------
          # Scenes
          # ----------------------------

          scenes_file = Path(
              "output/scenes/scenes.json"
          )

          if not scenes_file.exists():
              raise SystemExit(
                  "ERROR: scenes.json missing"
              )

          scenes = json.loads(
              scenes_file.read_text(
                  encoding="utf-8"
              )
          )

          scene_count = len(
              scenes.get("scenes", [])
          )

          print(
              f"Scenes: {scene_count}/{expected}"
          )

          if (
              scenes.get("status") != "completed"
              or scene_count != expected
          ):
              raise SystemExit(
                  "ERROR: Scene integrity check failed."
              )

          # ----------------------------
          # Audio
          # ----------------------------

          audio_dir = Path(
              "output/audio"
          )

          audio_files = list(
              audio_dir.rglob("*.mp3")
          ) + list(
              audio_dir.rglob("*.wav")
          )

          print(
              f"Audio files: {len(audio_files)}/{expected}"
          )

          if len(audio_files) < expected:
              raise SystemExit(
                  "ERROR: Missing audio files."
              )

          # ----------------------------
          # Visual manifest
          # ----------------------------

          visual_manifest = Path(
              "output/visuals/visual_jobs.json"
          )

          if not visual_manifest.exists():
              raise SystemExit(
                  "ERROR: visual_jobs.json missing."
              )

          visual_data = json.loads(
              visual_manifest.read_text(
                  encoding="utf-8"
              )
          )

          jobs = visual_data.get(
              "jobs",
              []
          )

          completed_jobs = [
              j for j in jobs
              if j.get("status") == "completed"
          ]

          print(
              f"Visual jobs: {len(jobs)}/{expected}"
          )

          print(
              f"Completed visual jobs: "
              f"{len(completed_jobs)}/{expected}"
          )

          if len(jobs) != expected:
              raise SystemExit(
                  "ERROR: Visual job count mismatch."
              )

          if len(completed_jobs) != expected:
              raise SystemExit(
                  "ERROR: Visual manifest incomplete."
              )

          # ----------------------------
          # Physical visual files
          # ----------------------------

          visual_files = []

          for part in range(1, int("${{ env.PARTS }}") + 1):
              for scene in range(1, int("${{ env.SCENES }}") + 1):

                  candidates = [
                      Path(
                          f"output/visuals/part_{part:02d}/scene_{scene:02d}.png"
                      ),
                      Path(
                          f"output/visuals/part_{part:02d}/scene_{scene:02d}.jpg"
                      ),
                      Path(
                          f"output/visuals/part_{part:02d}/scene_{scene:02d}.jpeg"
                      ),
                  ]

                  found = next(
                      (
                          p for p in candidates
                          if p.exists()
                          and p.stat().st_size > 0
                      ),
                      None
                  )

                  if found:
                      visual_files.append(found)
                  else:
                      raise SystemExit(
                          f"ERROR: Missing visual "
                          f"Part {part} Scene {scene}"
                      )

          print(
              f"Physical visuals: "
              f"{len(visual_files)}/{expected}"
          )

          if len(visual_files) != expected:
              raise SystemExit(
                  "ERROR: Physical visual count mismatch."
              )

          print()
          print(
              "=============================================="
          )
          print(
              "ALL PIPELINE ASSETS VALIDATED SUCCESSFULLY"
          )
          print(
              "=============================================="
          )
          PY


      # ======================================================
      # 19. THUMBNAILS
      # ======================================================

      - name: Install thumbnail dependencies
        shell: bash
        run: |
          set -e

          python3 -m pip install pillow


      - name: Generate thumbnails
        shell: bash
        run: |
          set -e

          python3 scripts/generate_thumbnail.py


      # ======================================================
      # 20. YOUTUBE PACKAGE
      # ======================================================

      - name: Generate YouTube upload package
        shell: bash
        run: |
          set -e

          python3 scripts/generate_youtube_metadata.py

          echo
          echo "NOTE: YouTube upload remains MANUAL."
          echo "No automatic YouTube upload is performed."


      # ======================================================
      # 21. RENDER
      # ======================================================

      - name: Render scene videos
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          STARTING VIDEO RENDER"
          echo "=============================================="

          python3 scripts/render_video.py


      # ======================================================
      # 22. UPLOAD RENDERED PARTS
      # ======================================================

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-rendered-videos
          path: output/rendered
          if-no-files-found: error
          retention-days: 7


      # ======================================================
      # 23. ASSEMBLE FINAL VIDEO
      # ======================================================

      - name: Assemble final video
        shell: bash
        run: |
          set -e

          mkdir -p output/final

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          rendered = sorted(
              Path("output/rendered").glob("*.mp4")
          )

          if not rendered:
              raise SystemExit(
                  "ERROR: No rendered videos found."
              )

          list_file = Path(
              "output/final/concat.txt"
          )

          with list_file.open(
              "w",
              encoding="utf-8"
          ) as f:

              for video in rendered:

                  safe = str(
                      video.resolve()
                  ).replace(
                      "'",
                      "'\\''"
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )

          output = Path(
              "output/final/lok-ai-final-video.mp4"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(list_file),
                  "-c",
                  "copy",
                  str(output),
              ],
              check=True
          )

          if not output.exists():
              raise SystemExit(
                  "ERROR: Final video was not created."
              )

          if output.stat().st_size <= 0:
              raise SystemExit(
                  "ERROR: Final video is empty."
              )

          print(
              f"Final video: {output}"
          )
          print(
              f"Size: {output.stat().st_size} bytes"
          )
          PY


      # ======================================================
      # 24. VALIDATE FINAL VIDEO
      # ======================================================

      - name: Validate final video
        shell: bash
        run: |
          set -e

          FINAL="output/final/lok-ai-final-video.mp4"

          test -s "$FINAL"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 \
            "$FINAL"


      # ======================================================
      # 25. UPLOAD FINAL VIDEO
      # ======================================================

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-final-video
          path: output/final/lok-ai-final-video.mp4
          if-no-files-found: error
          retention-days: 7


      # ======================================================
      # 26. PREPARE SUCCESS CHECKPOINT
      # ======================================================

      - name: Prepare successful checkpoint
        shell: bash
        run: |
          set -e

          rm -rf /tmp/lok-ai-checkpoint
          mkdir -p /tmp/lok-ai-checkpoint/output

          for dir in \
            config \
            checkpoints \
            story \
            scenes \
            narration \
            audio \
            visuals
          do
            if [ -d "output/$dir" ]; then
              mkdir -p "/tmp/lok-ai-checkpoint/output/$dir"
              cp -a "output/$dir/." \
                "/tmp/lok-ai-checkpoint/output/$dir/"
            fi
          done

          echo "Successful checkpoint prepared."


      # ======================================================
      # 27. UPLOAD SUCCESS CHECKPOINT
      # ======================================================

      - name: Upload successful checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-checkpoint
          path: /tmp/lok-ai-checkpoint
          if-no-files-found: error
          retention-days: 7
