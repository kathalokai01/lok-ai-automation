name: Generate Lok AI Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read configuration
        run: |
          echo "===== VIDEO CONFIGURATION ====="
          cat Input/topic.txt
          echo "==============================="

      - name: Validate configuration
        shell: bash
        run: |
          set -e

          CONFIG="Input/topic.txt"

          required_keys=(
            FORMAT
            AUDIENCE
            VOICE
            SPEED
            TOPIC
            PARTS
            SCENES
            STORY_LENGTH
            SCENE_DURATION
            CAPTIONS
            VISUAL_STYLE
            REALISM
            QUALITY
            FPS
            RESUME_ENABLED
            MAX_RETRIES
            SAVE_CHECKPOINT_AFTER_EACH_SCENE
            SKIP_COMPLETED_SCENES
            FAILURE_POLICY
          )

          for key in "${required_keys[@]}"; do
            if ! grep -qE "^${key}[[:space:]]*=" "$CONFIG"; then
              echo "ERROR: Missing configuration key: $key"
              exit 1
            fi
          done

          echo "Configuration validation: PASSED"

      - name: Prepare directories
        run: |
          mkdir -p output
          mkdir -p output/checkpoints
          mkdir -p output/scenes
          mkdir -p output/parts
          mkdir -p output/shorts
          
      - name: Generate story plan
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story_plan.py

          echo "===== STORY PLAN ====="
          cat output/story/story_plan.json
          echo "======================"

      - name: Generate story structure
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story.py

          echo "===== STORY STRUCTURE ====="
          cat output/story/story.json
          echo "==========================="

      - name: Test Gemini API
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/test_gemini.py

      - name: Prepare AI story generation
        shell: bash
        env:
         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_ai_story.py

          echo "===== AI STORY STRUCTURE ====="
          cat output/story/ai_story.json
          echo "=============================="
          
      - name: Create initial checkpoint
        shell: bash
        run: |
          CHECKPOINT="output/checkpoints/progress.json"

          if [ -f "$CHECKPOINT" ]; then
            echo "Existing checkpoint found."
            cat "$CHECKPOINT"
          else
            cat > "$CHECKPOINT" <<'EOF'
          {
            "status": "initialized",
            "completed_parts": [],
            "completed_scenes": [],
            "current_part": 1,
            "current_scene": 1,
            "last_completed": null
          }
          EOF
            echo "Initial checkpoint created."
          fi

      - name: Show project state
        run: |
          echo "===== PROJECT STATE ====="
          find output -maxdepth 3 -type f | sort
          echo "========================="

      - name: Save checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/checkpoints/progress.json output/story/story_plan.json output/story/story.json output/story/ai_story.json
          
          if git diff --cached --quiet; then
            echo "No checkpoint changes to commit."
          else
            git commit -m "Initialize video generation checkpoint"
            git push
          fi
