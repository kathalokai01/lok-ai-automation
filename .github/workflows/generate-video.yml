name: Generate Lok AI Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read configuration
        run: |
          echo "===== VIDEO CONFIGURATION ====="
          cat Input/topic.txt
          echo "==============================="

      - name: Validate configuration
        shell: bash
        run: |
          set -e

          CONFIG="Input/topic.txt"

          required_keys=(
            FORMAT
            AUDIENCE
            VOICE
            SPEED
            TOPIC
            PARTS
            SCENES
            STORY_LENGTH
            SCENE_DURATION
            CAPTIONS
            VISUAL_STYLE
            REALISM
            QUALITY
            FPS
            RESUME_ENABLED
            MAX_RETRIES
            SAVE_CHECKPOINT_AFTER_EACH_SCENE
            SKIP_COMPLETED_SCENES
            FAILURE_POLICY
          )

          for key in "${required_keys[@]}"; do
            if ! grep -qE "^${key}[[:space:]]*=" "$CONFIG"; then
              echo "ERROR: Missing configuration key: $key"
              exit 1
            fi
          done

          echo "Configuration validation: PASSED"

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p output
          mkdir -p output/config
          mkdir -p output/checkpoints
          mkdir -p output/scenes
          mkdir -p output/parts
          mkdir -p output/shorts
          mkdir -p output/story
          mkdir -p output/narration
          mkdir -p output/narration/audio
          mkdir -p output/visuals
          mkdir -p output/thumbnail
          mkdir -p output/publish

      - name: Generate story plan
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story_plan.py
          cat output/story/story_plan.json

      - name: Generate story structure
        shell: bash
        run: |
          set -e

          python3 scripts/generate_story.py
          cat output/story/story.json

      - name: Select Gemini Model
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/select_gemini_model.py
          cat output/config/selected_model.json

      - name: Test Gemini API
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/test_gemini.py

      - name: Prepare AI story generation
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_ai_story.py
          cat output/story/ai_story.json

      - name: Generate Character Bible
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_character_bible.py
          cat output/story/character_bible.json

      - name: Generate Scenes
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 scripts/generate_scenes.py
          cat output/scenes/scenes.json

      - name: Generate Narration
        shell: bash
        run: |
          set -e

          python3 scripts/generate_narration.py
          cat output/narration/narration.json

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 1

          echo "===== FFprobe ====="
          ffprobe -version | head -n 1

      - name: Generate Hindi TTS Audio
        shell: bash
        run: |
          set +e

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            edge-tts

          INSTALL_STATUS=$?

          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "ERROR: Edge TTS installation failed."
            exit "$INSTALL_STATUS"
          fi

          python3 scripts/generate_tts.py

          TTS_STATUS=$?

          if [ -f output/narration/audio_jobs.json ]; then
            echo "===== TTS MANIFEST ====="
            cat output/narration/audio_jobs.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/narration/audio_jobs.json

          if git diff --cached --quiet; then
            echo "No TTS checkpoint changes to commit."
          else
            git commit -m "Checkpoint TTS audio generation"
            git push
          fi

          if [ "$TTS_STATUS" -ne 0 ]; then
            echo "TTS generation failed."
            echo "Checkpoint was saved before stopping."
            exit "$TTS_STATUS"
          fi

      - name: Prepare Visual Generation
        shell: bash
        run: |
          set -e

          python3 scripts/prepare_visuals.py
          cat output/visuals/visual_jobs.json

      - name: Select Cloudflare Visual Model
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          python3 scripts/select_visual_model.py
          cat output/config/selected_visual_model.json

      - name: Generate Visuals
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e

          python3 scripts/generate_visuals.py

          GENERATION_STATUS=$?

          if [ -f output/visuals/visual_jobs.json ]; then
            echo "===== VISUAL MANIFEST ====="
            cat output/visuals/visual_jobs.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/visuals/visual_jobs.json

          if git diff --cached --quiet; then
            echo "No visual checkpoint changes to commit."
          else
            git commit -m "Checkpoint visual generation"
            git push
          fi

          if [ "$GENERATION_STATUS" -ne 0 ]; then
            echo "Visual generation failed."
            echo "Checkpoint was saved before stopping."
            exit "$GENERATION_STATUS"
          fi

      - name: Install Thumbnail Dependencies
        shell: bash
        run: |
          set -e

          echo "===== Installing Pillow ====="

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            Pillow

          echo "===== Installing Hindi Fonts ====="

          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

          echo "===== Verifying Fonts ====="

          fc-list | grep -i "Noto Sans Devanagari" | head -n 5 || true

      - name: Generate Thumbnail
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        GENERATING THUMBNAILS"
          echo "======================================"

          test -f scripts/generate_thumbnail.py
          test -f output/visuals/visual_jobs.json

          python3 scripts/generate_thumbnail.py

          echo
          echo "===== THUMBNAIL FILES ====="

          find output/thumbnail \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "===== THUMBNAIL MANIFEST ====="

          test -f output/thumbnail/thumbnail_manifest.json
          cat output/thumbnail/thumbnail_manifest.json

          echo
          echo "===== THUMBNAIL VALIDATION ====="

          test -s output/thumbnail/thumbnail_1280x720.jpg
          test -s output/thumbnail/thumbnail_1080x1920.jpg

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = {
              "16:9": Path("output/thumbnail/thumbnail_1280x720.jpg"),
              "9:16": Path("output/thumbnail/thumbnail_1080x1920.jpg"),
          }

          expected = {
              "16:9": (1280, 720),
              "9:16": (1080, 1920),
          }

          for name, path in files.items():
              with Image.open(path) as image:
                  print(f"{name}: {path}")
                  print(f"Size: {image.size}")
                  print(f"Format: {image.format}")

                  if image.size != expected[name]:
                      raise SystemExit(
                          f"ERROR: {name} thumbnail has wrong size: {image.size}"
                      )

          print("Thumbnail validation: PASSED")
          PY

      - name: Generate YouTube Upload Package
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "     YOUTUBE UPLOAD PACKAGE"
          echo "======================================"

          test -f scripts/generate_youtube_metadata.py
          test -f Input/topic.txt
          test -f output/story/ai_story.json
          test -f output/config/selected_model.json

          mkdir -p output/publish

          python3 scripts/generate_youtube_metadata.py

          echo
          echo "===== VALIDATING PACKAGE ====="

          test -s output/publish/youtube_metadata.json
          test -s output/publish/youtube_title.txt
          test -s output/publish/youtube_description.txt
          test -s output/publish/youtube_tags.txt

          echo
          echo "===== TITLE ====="
          cat output/publish/youtube_title.txt

          echo
          echo "===== TAGS ====="
          cat output/publish/youtube_tags.txt

          echo
          echo "===== PACKAGE FILES ====="

          find output/publish \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "======================================"
          echo "YouTube upload package generated."
          echo "No automatic YouTube upload is performed."
          echo "======================================"

      - name: Render Scene Videos
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       RENDERING SCENE VIDEOS"
          echo "======================================"

          test -f scripts/render_video.py
          test -f output/narration/audio_jobs.json
          test -f output/visuals/visual_jobs.json

          python3 scripts/render_video.py

          echo
          echo "===== VIDEO RENDER MANIFEST ====="

          test -f output/video_render_manifest.json
          cat output/video_render_manifest.json

          echo
          echo "===== GENERATED PART VIDEOS ====="

          find output/parts \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            -print \
            | sort

          echo
          echo "===== GENERATED SCENE VIDEOS ====="

          find output/scenes \
            -type f \
            -name "*.mp4" \
            -print \
            | sort

      - name: Upload Rendered Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-rendered-videos
          path: |
            output/scenes/**/*.mp4
            output/parts/*.mp4
            output/video_render_manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Final Video
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          ASSEMBLING FINAL VIDEO"
          echo "======================================"

          PART_COUNT=$(find output/parts \
            -maxdepth 1 \
            -type f \
            -name "part_*.mp4" \
            | wc -l)

          echo "Part videos found: $PART_COUNT"

          if [ "$PART_COUNT" -eq 0 ]; then
            echo "ERROR: No part videos found."
            exit 1
          fi

          rm -f \
            output/final_video_concat.txt \
            output/final_video.tmp.mp4 \
            output/final_video.mp4

          find output/parts \
            -maxdepth 1 \
            -type f \
            -name "part_*.mp4" \
            -print0 \
            | sort -z \
            | while IFS= read -r -d "" file; do

                if [ ! -s "$file" ]; then
                  echo "ERROR: Empty part video: $file"
                  exit 1
                fi

                printf "file '%s'\n" "$(realpath "$file")" \
                  >> output/final_video_concat.txt

              done

          echo
          echo "===== CONCAT LIST ====="
          cat output/final_video_concat.txt

          echo
          echo "===== FFMPEG FINAL ASSEMBLY ====="

          ffmpeg -y \
            -hide_banner \
            -loglevel error \
            -f concat \
            -safe 0 \
            -i output/final_video_concat.txt \
            -c copy \
            -movflags +faststart \
            output/final_video.tmp.mp4

          test -s output/final_video.tmp.mp4

          mv \
            output/final_video.tmp.mp4 \
            output/final_video.mp4

          echo
          echo "===== FINAL VIDEO ====="

          ls -lh output/final_video.mp4

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/final_video.mp4)

          echo "Final duration: ${DURATION}s"

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("output/final_video.mp4")
          render_manifest = Path("output/video_render_manifest.json")

          duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(video),
                  ],
                  text=True,
              ).strip()
          )

          if duration <= 0:
              raise SystemExit(
                  "ERROR: Final video duration is invalid."
              )

          data = json.loads(
              render_manifest.read_text(encoding="utf-8")
          )

          parts = data.get("parts", [])
          scenes = data.get("total_scenes", 0)

          if not parts:
              raise SystemExit(
                  "ERROR: Render manifest contains no parts."
              )

          final_manifest = {
              "status": "completed",
              "output": str(video),
              "duration": round(duration, 3),
              "parts": len(parts),
              "scenes": scenes,
              "format": data.get("format"),
              "width": data.get("width"),
              "height": data.get("height"),
              "fps": data.get("fps"),
          }

          Path(
              "output/final_video_manifest.json"
          ).write_text(
              json.dumps(
                  final_manifest,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  final_manifest,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Validate Final Video & Package
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       FINAL QUALITY VALIDATION"
          echo "======================================"

          echo
          echo "===== REQUIRED FILES ====="

          required_files=(
            "output/final_video.mp4"
            "output/final_video_manifest.json"
            "output/video_render_manifest.json"
            "output/thumbnail/thumbnail_1280x720.jpg"
            "output/thumbnail/thumbnail_1080x1920.jpg"
            "output/thumbnail/thumbnail_manifest.json"
            "output/publish/youtube_metadata.json"
            "output/publish/youtube_title.txt"
            "output/publish/youtube_description.txt"
            "output/publish/youtube_tags.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "ERROR: Missing or empty file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo
          echo "===== FINAL VIDEO STREAM VALIDATION ====="

          VIDEO_INFO=$(ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -show_entries \
            format=duration,size \
            -of json \
            output/final_video.mp4)

          echo "$VIDEO_INFO"

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("output/final_video.mp4")

          if not video.exists() or video.stat().st_size < 100000:
              raise SystemExit(
                  "ERROR: Final video is missing or suspiciously small."
              )

          probe = subprocess.check_output(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "stream=index,codec_type,codec_name,width,height,r_frame_rate",
                  "-show_entries",
                  "format=duration,size",
                  "-of",
                  "json",
                  str(video),
              ],
              text=True,
          )

          data = json.loads(probe)
          streams = data.get("streams", [])

          video_streams = [
              s for s in streams
              if s.get("codec_type") == "video"
          ]

          audio_streams = [
              s for s in streams
              if s.get("codec_type") == "audio"
          ]

          if not video_streams:
              raise SystemExit(
                  "ERROR: Final video contains no video stream."
              )

          if not audio_streams:
              raise SystemExit(
                  "ERROR: Final video contains no audio stream."
              )

          video_stream = video_streams[0]

          width = video_stream.get("width")
          height = video_stream.get("height")

          if width != 720 or height != 1280:
              raise SystemExit(
                  f"ERROR: Unexpected final resolution: "
                  f"{width}x{height}. Expected 720x1280."
              )

          duration = float(
              data.get("format", {}).get("duration", 0)
          )

          if duration <= 0:
              raise SystemExit(
                  "ERROR: Final video duration is invalid."
              )

          print(f"Video codec: {video_stream.get('codec_name')}")
          print(f"Audio codec: {audio_streams[0].get('codec_name')}")
          print(f"Resolution: {width}x{height}")
          print(f"Duration: {duration:.3f}s")
          print("Video/audio validation: PASSED")
          PY

          echo
          echo "===== FINAL MANIFEST VALIDATION ====="

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("output/final_video_manifest.json")
              .read_text(encoding="utf-8")
          )

          if manifest.get("status") != "completed":
              raise SystemExit(
                  "ERROR: Final video manifest is not completed."
              )

          if manifest.get("output") != "output/final_video.mp4":
              raise SystemExit(
                  "ERROR: Final manifest points to wrong output."
              )

          if manifest.get("parts", 0) <= 0:
              raise SystemExit(
                  "ERROR: Final manifest has no parts."
              )

          if manifest.get("scenes", 0) <= 0:
              raise SystemExit(
                  "ERROR: Final manifest has no scenes."
              )

          if manifest.get("duration", 0) <= 0:
              raise SystemExit(
                  "ERROR: Final manifest has invalid duration."
              )

          print(json.dumps(
              manifest,
              ensure_ascii=False,
              indent=2
          ))

          print("Final manifest validation: PASSED")
          PY

          echo
          echo "===== RENDER MANIFEST VALIDATION ====="

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("output/video_render_manifest.json")
              .read_text(encoding="utf-8")
          )

          parts = data.get("parts", [])
          scenes = data.get("total_scenes", 0)

          if not parts:
              raise SystemExit(
                  "ERROR: Render manifest contains no parts."
              )

          if scenes <= 0:
              raise SystemExit(
                  "ERROR: Render manifest contains no scenes."
              )

          print(f"Rendered parts: {len(parts)}")
          print(f"Rendered scenes: {scenes}")

          print("Render manifest validation: PASSED")
          PY

          echo
          echo "===== THUMBNAIL VALIDATION ====="

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = {
              "16:9": (
                  Path("output/thumbnail/thumbnail_1280x720.jpg"),
                  (1280, 720),
              ),
              "9:16": (
                  Path("output/thumbnail/thumbnail_1080x1920.jpg"),
                  (1080, 1920),
              ),
          }

          for name, (path, expected) in files.items():
              with Image.open(path) as image:
                  print(
                      f"{name}: "
                      f"{image.size} "
                      f"{image.format}"
                  )

                  if image.size != expected:
                      raise SystemExit(
                          f"ERROR: Wrong {name} thumbnail size: "
                          f"{image.size}"
                      )

          print("Thumbnail validation: PASSED")
          PY

          echo
          echo "===== YOUTUBE PACKAGE VALIDATION ====="

          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path(
              "output/publish/youtube_metadata.json"
          )

          metadata = json.loads(
              metadata_path.read_text(encoding="utf-8")
          )

          title = str(
              metadata.get("title", "")
          ).strip()

          description = str(
              metadata.get("description", "")
          ).strip()

          tags = metadata.get("tags", [])

          if not title:
              raise SystemExit(
                  "ERROR: YouTube title is empty."
              )

          if not description:
              raise SystemExit(
                  "ERROR: YouTube description is empty."
              )

          if not isinstance(tags, list) or not tags:
              raise SystemExit(
                  "ERROR: YouTube tags are missing."
              )

          if len(title) > 100:
              raise SystemExit(
                  f"ERROR: YouTube title is too long: "
                  f"{len(title)} characters."
              )

          print(f"Title length: {len(title)}")
          print(f"Description length: {len(description)}")
          print(f"Tag count: {len(tags)}")

          print("YouTube package validation: PASSED")
          PY

          echo
          echo "======================================"
          echo "       FINAL VALIDATION PASSED"
          echo "======================================"
          echo "Video:       OK"
          echo "Audio:       OK"
          echo "Duration:    OK"
          echo "Resolution:  OK"
          echo "Render:      OK"
          echo "Thumbnails:  OK"
          echo "Metadata:    OK"
          echo "Package:     OK"
          echo "======================================"

      - name: Upload Final Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-ai-final-video
          path: |
            output/final_video.mp4
            output/final_video_manifest.json
            output/video_render_manifest.json
            output/parts/*.mp4
            output/thumbnail/thumbnail_1280x720.jpg
            output/thumbnail/thumbnail_1080x1920.jpg
            output/thumbnail/thumbnail_manifest.json
            output/publish/youtube_metadata.json
            output/publish/youtube_title.txt
            output/publish/youtube_description.txt
            output/publish/youtube_tags.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create initial checkpoint
        shell: bash
        run: |
          set -e

          CHECKPOINT="output/checkpoints/progress.json"

          if [ -f "$CHECKPOINT" ]; then
            cat "$CHECKPOINT"
          else
            cat > "$CHECKPOINT" <<'EOF'
          {
            "status": "initialized",
            "completed_parts": [],
            "completed_scenes": [],
            "current_part": 1,
            "current_scene": 1,
            "last_completed": null
          }
          EOF
          fi

      - name: Show project state
        run: |
          echo "===== OUTPUT FILES ====="
          find output -maxdepth 5 -type f | sort

      - name: Save checkpoint
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/config/selected_model.json \
            output/config/selected_visual_model.json \
            output/checkpoints/progress.json \
            output/story/story_plan.json \
            output/story/story.json \
            output/story/ai_story.json \
            output/story/character_bible.json \
            output/scenes/scenes.json \
            output/narration/narration.json \
            output/narration/audio_jobs.json \
            output/visuals/visual_jobs.json \
            output/video_render_manifest.json

          if git diff --cached --quiet; then
            echo "No checkpoint changes to commit."
          else
            git commit -m "Save video pipeline checkpoint"
            git push
          fi
